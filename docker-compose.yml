services:
  api:
    build: .
    expose:
      - "8000"
    volumes:
      # Mounted rather than baked in: the settings panel writes to this file,
      # and a change made through it has to outlive the container.
      #
      # `:Z` relabels the file for this container alone under SELinux (Fedora,
      # RHEL, Bluefin, ...) — required for a rootless Podman to read it at all,
      # and a harmless no-op on a Docker host without SELinux.
      - ./config.json:/app/config.json:Z
    # A bind mount keeps the host file's ownership, which the image cannot know
    # in advance: under a rootless Podman the user who started the stack appears
    # inside the container as uid 0, under Docker as their own uid. The image's
    # own `qkd` user (10001) matches neither, so it could read the file but not
    # write it, and saving from the settings panel failed with EACCES. Uid 0 is
    # the one value that works in both cases — and under rootless Podman it is
    # not root at all, only the unprivileged user who ran `podman compose`.
    # On a rootful Docker host, set QKD_UID=$(id -u) to stay off root.
    user: "${QKD_UID:-0}:${QKD_GID:-0}"
    healthcheck:
      # Tests if the socket is open using the local interpreter instead of image
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/plugins').read()"
      interval: 10s
      timeout: 5s
      retries: 5
      # Qiskit is slow to import; without this the first few probes would fail
      # on a container that is perfectly healthy and merely still starting.
      start_period: 40s
    restart: unless-stopped

  web:
    build: ./web
    ports:
      # The engine is not published, so this is the only way in. 8000 is also
      # the port uvicorn uses when run directly for development: the two never
      # run together, but a stray dev server will hold it and stop this starting.
      - "${QKD_PORT:-8000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
