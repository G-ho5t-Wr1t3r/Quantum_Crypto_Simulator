services:
  api:
    build: .
    expose:
      - "8000"
    volumes:
      # Mounted rather than baked in: the settings panel writes to this file,
      # and a change made through it has to outlive the container.
      - ./config.json:/app/config.json
    healthcheck:
      # Tests if the socket is open using the local interpeter instead of image
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/plugins').read()"
      interval: 10s
      timeout: 5s
      retries: 5
      # Qiskit is slow to import; without this the first few probes would fail
      # on a container that is perfectly healthy and merely still starting.
      start_period: 40s
    restart: unless-stopped

  web:
    build: ./web
    ports:
      # The engine is not published, so this is the only way in. 8000 is also
      # the port uvicorn uses when run directly for development: the two never
      # run together, but a stray dev server will hold it and stop this starting.
      - "${QKD_PORT:-8000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
