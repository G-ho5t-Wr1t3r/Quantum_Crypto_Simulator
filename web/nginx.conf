server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The interface routes on the client, so /run, /explore and /compare are not
    # files on disk. Without this fallback a reload on any of them — or a link
    # someone shares — would be a 404 from nginx that the app never sees.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so a stale copy can never be served for new content.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # Trailing slash on both sides: the prefix exists only to separate the
        # API from the interface's own paths, and the backend serves at the root.
        proxy_pass http://api:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The event stream is a WebSocket, and an upgrade is not an ordinary
        # request: without these three lines it is answered as HTTP and the run
        # is never seen live.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A quiet stream is not a dead one. A sweep spends whole minutes inside
        # a single point with nothing to send, and the default 60s would drop
        # the socket in the middle of it.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Off, or nginx would hold each event back waiting for a buffer to fill
        # and deliver the run in bursts at the end.
        proxy_buffering off;
    }
}
